[project]
name = "LoSakura"
version = "0.1.0"
description = "Losakura is a company"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "openai>=2.32.0",
    "python-dotenv>=1.2.2",
    "toml>=0.10.2",
    "loguru>=0.7.2",
    "anyio>=4.13.0",
    "certifi>=2026.4.22",
    "colorama>=0.4.6",
    "distro>=1.9.0",
    "h11>=0.16.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "idna>=3.13",
    "jiter>=0.14.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "sniffio>=1.3.1",
    "tqdm>=4.67.3",
    "typing-extensions>=4.15.0",
    "fastapi>=0.136.1",
    "numpy>=2.2.6",
    "faiss-cpu>=1.13.2",
    "sentence-transformers>=5.4.1",
    "tiktoken>=0.12.0",
    "asyncpg>=0.31.0",
    "psutil>=7.2.2",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "loframework>=0.1.0",
]
[tool.uv.sources]
loframework = {workspace = true}
[tool.uv.workspace]
members = [
    "Loframework",
]
[tool.setuptools]
packages = ["losakura"]


[tool.pytest.ini_options]
pythonpath = ["."]
